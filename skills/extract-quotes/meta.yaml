name: extract-quotes
version: 2
description: Pick the most citable passages of a chapter, or the book's defining lines, as verbatim, paged quote blocks.
tier: distil
job_kind: derive
artifact_type: quote_set
scope: chapter
selector: scope_blocks
document_selector: document_quotes  # no anchor: the whole book (skills/README.md)
vision: false
gates:
  grounding_min: 0.9    # each quote is a leaf (text + cites); reads source blocks, since quotes must be verbatim
