artifact_type: concept_links    # the book type: app.graph.apply projects it unchanged
scope: document
selector: paper_concepts
vision: false
genre: paper   # a paper skill (docs/PAPERS.md P2)
gates:
  grounding_min: 0.9    # concept blurbs are spans; every edge's evidence array is anchor-checked too
