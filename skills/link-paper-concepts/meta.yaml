name: link-paper-concepts
version: 1
description: Extract a paper's concepts — its methods, datasets, metrics and tasks, plus the ideas, frameworks, terms, people and works it treats — reusing the shelf's canonical names, and propose evidence-backed edges between concepts and passages for the idea graph.
tier: reason
