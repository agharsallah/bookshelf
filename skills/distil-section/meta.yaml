name: distil-section
version: 1
description: Distil one section into a cited section note — what the reader must retain, at 10–25% of the section's words, in render blocks.
tier: distil
job_kind: distil_section
artifact_type: section_note
scope: section            # the runtime also runs it on a chapter that has no sections
selector: scope_blocks
vision: false
gates:
  grounding_min: 0.9
  compression: [0.10, 0.25]   # output words / words of the section's leaf blocks (§9 D14)
