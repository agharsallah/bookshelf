name: distil-section
version: 2
description: Distil one section into an in-depth cited study note — every framework, procedure, example and caveat, with Mermaid diagrams, at 25–60% of the section's words.
tier: distil
job_kind: distil_section
artifact_type: section_note
scope: section            # also on a chapter anchor: all its blocks if it has no sections,
                          # else only its intro (leaves no section holds)
selector: scope_blocks
vision: false
gates:
  grounding_min: 0.9
  # output words / words of the section's leaf blocks (§9 D14). In-depth notes aim for 25–60%;
  # list- and checklist-dense sections legitimately run longer, so the flag starts at 90%.
  compression: [0.25, 0.90]
