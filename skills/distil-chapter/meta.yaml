name: distil-chapter
version: 2
description: Merge a chapter's in-depth section notes into one cited chapter study guide — a big-picture Mermaid diagram, every framework at full depth, deduplicated, with callouts and a practice checklist.
tier: distil
job_kind: distil_chapter
artifact_type: chapter_distillation
scope: chapter
selector: chapter_section_notes
vision: false
gates:
  grounding_min: 0.9
  # Basis: output words / the chapter's SOURCE words (all leaf blocks under the chapter),
  # the same denominator distil-section uses — not the section notes' words. The runtime's
  # Selection.source_words is the scope's leaf-block word count for this selector. So the
  # band means what §9 says at both ranks; since in-depth section notes run at 25–60% of the
  # source, the prompt aims for ~80–100% of the notes' combined length.
  compression: [0.20, 1.00]   # checklist chapters keep every item: flag only beyond the source
